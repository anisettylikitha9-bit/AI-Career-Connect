services:
  - type: web
    name: ai-career-connect
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-career-connect-db
          property: connectionString
      - key: MISTRAL_API_KEY
        sync: false # Must be set manually in the Render Dashboard
      - key: MISTRAL_MODEL
        value: mistral-large-latest

databases:
  - name: ai-career-connect-db
    plan: free
