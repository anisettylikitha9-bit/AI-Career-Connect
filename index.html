{% extends "base.html" %}
{% block title %}Career Roadmap - AI Career Connect{% endblock %}

{% block content %}
<h2><i class="bi bi-map"></i> Career Roadmap Generator</h2>

<div class="card shadow mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="career_goal" class="form-label">Your Career Goal</label>
                <input type="text" name="career_goal" id="career_goal" class="form-control"
                       placeholder="e.g. Become a Machine Learning Engineer" required>
            </div>
            <button type="submit" class="btn btn-warning">
                <i class="bi bi-compass"></i> Generate Roadmap
            </button>
        </form>
    </div>
</div>

{% if roadmap %}
<div class="card shadow mt-4">
    <div class="card-header"><h5 class="mb-0">Your Career Roadmap</h5></div>
    <div class="card-body">
        <div class="roadmap-content">{{ roadmap | safe }}</div>
    </div>
</div>
{% endif %}
{% endblock %}
